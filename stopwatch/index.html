<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">
        <p>Stopwatch</p>

        <div class="counter_frame">
            <h3 class="clock" id="counter">00:00:00:00</h3>
            <p id="status">Paused</p>
        </div>

        <div class="buttons">
            <div class="bt" id="play"><img src="./assets/images/play-button.png" alt="Play Button"></div>
            <div class="bt stopbtn" id="stop"><img src="./assets/images/stop-button.png" alt="Stop Button"></div>
            <div class="bt" id="refresh"><img src="./assets/images/refresh-arrow.png" alt="Refresh Button"> </div>


        </div>


    </div>

    <script src="./index.js"></script>
</body>

</html>
